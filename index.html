<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Gerenciador de Tarefas</title>
<style>
:root{
  --bg:#f1f3f6; --card:#ffffff; --border:#e4e8ef; --text:#1f2937; --muted:#6b7280;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-soft:#eaf1ff; --navy:#1e3a8a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.4;
  display:grid; grid-template-columns:250px 1fr; min-height:100vh;
}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- Status & prioridade (cores) ---------- */
.s-todo{--c:#ef4444;--bg:#fee2e2;--fg:#b91c1c}
.s-doing{--c:#f59e0b;--bg:#fef3c7;--fg:#92400e}
.s-done{--c:#22c55e;--bg:#dcfce7;--fg:#166534}
.p-low{--bg:#bae6fd;--fg:#0c4a6e}
.p-mid{--bg:#3b82f6;--fg:#ffffff}
.p-high{--bg:#1e3a8a;--fg:#ffffff}

/* ---------- Sidebar ---------- */
#sidebar{
  background:var(--card); border-right:1px solid var(--border);
  padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 22px;color:var(--navy)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:#374151;cursor:pointer;font-weight:500;user-select:none;
}
.nav-item:hover{background:#f3f5f9}
.nav-item.active{background:var(--blue-soft);color:var(--blue-d);font-weight:600}
.nav-item svg{flex:none}
.nav-group{margin-top:16px}
.nav-title{
  display:flex;align-items:center;justify-content:space-between;padding:6px 12px 6px 12px;
  color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.nav-title span{display:flex;align-items:center;gap:8px}
.add-btn{
  width:24px;height:24px;border-radius:7px;border:0;background:var(--blue-soft);color:var(--blue-d);
  font-size:17px;line-height:1;display:grid;place-items:center;padding:0;
}
.add-btn:hover{background:var(--blue);color:#fff}
.space-list{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.space-item{padding-left:22px}
.space-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space-item .hash{width:8px;height:8px;border-radius:3px;background:var(--blue);opacity:.55;flex:none}
.space-item.active .hash{opacity:1}
.space-item .x{
  display:none;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;
  width:22px;height:22px;border-radius:6px;padding:0;
}
.space-item:hover .x{display:block}
.space-item .x:hover{background:#fee2e2;color:#b91c1c}
.empty-note{padding:6px 12px 6px 34px;color:var(--muted);font-size:13px}

/* ---------- Main ---------- */
main{padding:28px 34px 50px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted)}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}
.month-nav .lbl{min-width:150px;text-align:center;font-weight:600}
.mn-btn{border:0;background:transparent;width:32px;height:32px;border-radius:8px;font-size:18px;color:#374151}
.mn-btn:hover{background:var(--blue-soft);color:var(--blue-d)}
.today-btn{border:0;background:var(--blue-soft);color:var(--blue-d);font-weight:600;border-radius:8px;padding:7px 12px}
.today-btn:hover{background:#dbe7ff}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.stat.green::before{background:#22c55e}
.stat.red::before{background:#ef4444}
.stat .l{color:var(--muted);font-weight:600;font-size:13px}
.stat .n{font-size:32px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.stat.b .n{color:var(--blue-d)}
.stat .s{color:var(--muted);font-size:12.5px}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:#e6eaf1;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:#4b5563}
.seg button:hover{color:var(--blue-d)}
.seg button.on{background:var(--card);color:var(--blue-d);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;border-color:var(--border);color:#374151}
.btn.ghost:hover{background:#f3f5f9}
.btn.danger{background:#fff;border-color:#fecaca;color:#b91c1c}
.btn.danger:hover{background:#fee2e2}

/* ---------- Cards / tabelas ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h2{margin:0;font-size:16px}
.count{background:var(--blue-soft);color:var(--blue-d);font-weight:700;font-size:12px;border-radius:999px;padding:2px 9px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{
  text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:700;padding:11px 16px;background:#fafbfc;border-bottom:1px solid var(--border);
}
td{padding:11px 16px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafcff}
.name-input{
  width:100%;border:1px solid transparent;background:transparent;padding:7px 9px;border-radius:8px;font-weight:600;color:var(--text);
}
.name-input:hover{border-color:var(--border);background:#fff}
.name-input:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
tr.is-done .name-input{color:var(--muted);text-decoration:line-through}
.period-btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;color:#374151;
  border-radius:9px;padding:7px 11px;font-weight:500;white-space:nowrap;
}
.period-btn:hover{border-color:var(--blue);color:var(--blue-d)}
.period-btn svg{color:var(--blue)}
.period-btn.wide{width:100%;justify-content:flex-start;padding:10px 12px}

.sel{position:relative;display:inline-block;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:600;font-size:13px}
.sel select{
  appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font:inherit;
  padding:6px 28px 6px 14px;border-radius:999px;cursor:pointer;
}
.sel select:focus{outline:2px solid rgba(37,99,235,.35)}
.sel select option{color:#111827;background:#fff}
.sel::after{
  content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.sel.st select{padding-left:26px}
.sel.st::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--c)}

.sched{display:flex;flex-direction:column;gap:5px;min-width:160px}
.bar{height:8px;border-radius:99px;background:#e5e9f0;overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#60a5fa,var(--blue));transition:width .4s}
.fill.done{background:#22c55e}
.fill.late{background:#ef4444}
.sched-txt{font-size:12px;color:var(--muted)}
.sched-txt.late{color:#b91c1c;font-weight:600}
.sched-txt.done{color:#166534}
.icon-btn{border:0;background:transparent;color:#9ca3af;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:#fee2e2;color:#b91c1c}
.empty-row td{text-align:center;color:var(--muted);padding:26px}
.add-row td{padding:8px 16px}
.add-inline{border:0;background:transparent;color:var(--blue-d);font-weight:600;padding:6px 8px;border-radius:8px}
.add-inline:hover{background:var(--blue-soft)}

/* ---------- Linha do tempo ---------- */
.tl-scroll{overflow-x:auto}
.tl{min-width:calc(var(--nc,220px) + var(--n) * 34px)}
.tl-head,.tl-row{display:grid;grid-template-columns:var(--nc,220px) 1fr}
.tl-head{background:#fafbfc;border-bottom:1px solid var(--border)}
.tl-name-h{padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;position:sticky;left:0;background:#fafbfc;z-index:2}
.tl-days{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.tl-day{text-align:center;padding:6px 0;font-size:12px;font-weight:600;color:#4b5563;border-left:1px solid var(--border);display:flex;flex-direction:column}
.tl-day small{font-size:10px;color:var(--muted);font-weight:500}
.tl-day.we{color:#9ca3af}
.tl-day.today{color:var(--blue-d);background:var(--blue-soft)}
.tl-row{border-bottom:1px solid #eef1f5}
.tl-row:last-child{border-bottom:0}
.tl-name{
  padding:8px 16px;display:flex;align-items:center;gap:9px;font-weight:600;min-height:46px;
  position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--border);overflow:hidden;
}
.tl-name span.t{overflow-wrap:anywhere;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tl-track{
  position:relative;min-height:46px;
  background-image:linear-gradient(to right,#eef1f5 1px,transparent 1px);
  background-size:calc(100% / var(--n)) 100%;
}
.bar-chip,.tl-bar{
  background:var(--bg);color:var(--fg);border-left:4px solid var(--c);border-radius:8px;
}
.tl-bar{
  position:absolute;top:50%;transform:translateY(-50%);height:28px;padding:0 10px;display:flex;align-items:center;font-weight:600;font-size:12.5px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;
}
.tl-bar:hover{filter:brightness(.97);box-shadow:0 1px 4px rgba(15,23,42,.15)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);opacity:.55;pointer-events:none}

/* ---------- Calendário ---------- */
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-head div{padding:11px;text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:#fafbfc;border-bottom:1px solid var(--border)}
.cal-cell{min-height:118px;padding:8px;border-right:1px solid #eef1f5;border-bottom:1px solid #eef1f5;cursor:pointer;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:#fafcff}
.cal-cell.blank{background:#fafbfc;cursor:default}
.cal-num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;font-weight:600;font-size:13px;margin-bottom:5px}
.cal-cell.today .cal-num{background:var(--blue);color:#fff}
.chip{
  background:var(--bg);color:var(--fg);border-left:3px solid var(--c);border-radius:6px;
  padding:3px 7px;font-size:12px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
}
.chip:hover{filter:brightness(.96)}
.more{font-size:11.5px;color:var(--muted);padding-left:4px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:16px;overflow-x:auto;align-items:start}
.kcol{background:#e9edf3;border-radius:var(--radius);padding:12px;min-height:200px;border:2px solid transparent}
.kcol.drop-over{border-color:var(--blue);background:#e2ebfb}
.kcol-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-weight:700}
.kcol-head .count{margin-left:auto}
.kcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kcard:hover{border-color:#bcd0f7}
.kcard.dragging{opacity:.45}
.kcard .kt{font-weight:600;margin-bottom:8px}
.kcard .km{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.kdate{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.pri{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);color:var(--fg)}
.kadd{width:100%;border:1px dashed #b8c3d6;background:transparent;border-radius:10px;padding:9px;color:#4b5563;font-weight:600}
.kadd:hover{background:#fff;color:var(--blue-d);border-color:var(--blue)}

/* ---------- Home / vazio ---------- */
.placeholder{background:var(--card);border:1px dashed #c7d0df;border-radius:var(--radius);padding:60px 20px;text-align:center;color:var(--muted)}
.placeholder h2{color:var(--text);margin:0 0 6px}

/* ---------- Modais ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;z-index:100;padding:16px}
.overlay.top{z-index:200}
.overlay.topmost{z-index:300}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(15,23,42,.25);max-height:92vh;overflow-y:auto}
.modal.sm{max-width:400px}
.modal h3{margin:0 0 4px;font-size:19px}
.modal .muted{color:var(--muted);margin:0 0 18px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:#374151}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.input,.modal input[type=text]{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);
}
.input:focus,.modal input[type=text]:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.input.err{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.14)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-actions .sp{flex:1}

.picker{max-width:340px;padding:20px}
.pk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pk-week,.pk-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.pk-week div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.pk-cell{height:38px;display:grid;place-items:center}
.pk-cell.rng{background:var(--blue-soft)}
.pk-cell.rs{border-radius:99px 0 0 99px}
.pk-cell.re{border-radius:0 99px 99px 0}
.pk-cell.rs.re{border-radius:99px}
.pk-day{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-weight:500;color:var(--text)}
.pk-day:hover{background:#dbe7ff}
.pk-day.today{border:1px solid var(--blue)}
.pk-day.end{background:var(--blue);color:#fff;font-weight:700}
.pk-info{margin:12px 0 0;padding:10px 12px;background:#f6f8fb;border-radius:10px;font-weight:600}
.pk-hint{margin:6px 2px 0;font-size:12px;color:var(--muted)}

/* ---------- Nome da tarefa (clicável, quebra linha) ---------- */
.name-btn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-weight:600;color:var(--text);overflow-wrap:anywhere;line-height:1.35}
.name-btn:hover{background:var(--blue-soft);color:var(--blue-d)}
tr.is-done .name-btn{color:var(--muted);text-decoration:line-through}
.sub-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);margin:2px 8px 0}
.sub-badge.all{color:#166534}
.kcard .sub-badge{margin:0 0 9px}
.kcard .kt{overflow-wrap:anywhere}

/* ---------- Tela da tarefa: subtarefas e observações ---------- */
.modal.lg{max-width:580px}
textarea.input{resize:vertical;min-height:90px;font:inherit;line-height:1.45}
textarea.autosize{resize:none;min-height:0;overflow:hidden;display:block}
.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.field-head span{font-weight:600;font-size:13px;color:#374151}
.field-head small{color:var(--muted);font-weight:600}
.subs{border:1px solid var(--border);border-radius:12px;padding:10px}
.sub-prog{margin-bottom:8px}
.sub-row{display:flex;align-items:flex-start;gap:8px;padding:2px 0}
.sub-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:none;margin:9px 0 0}
.sub-row .sub-text{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:8px 9px;background:transparent;color:var(--text);font:inherit;resize:none;overflow:hidden;line-height:1.35}
.sub-row .sub-text:hover{border-color:var(--border)}
.sub-row .sub-text:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.sub-row.done .sub-text{color:var(--muted);text-decoration:line-through}
.sub-row .icon-btn{flex:none}
.sub-empty{color:var(--muted);font-size:13px;padding:4px 2px 8px}
.sub-add{display:flex;gap:8px;margin-top:8px}
.sub-add input{flex:1;min-width:0}

/* ---------- Agenda do calendário (celular) ---------- */
.cal-agenda{display:none}
.ag-day{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #eef1f5}
.ag-day:last-child{border-bottom:0}
.ag-date{flex:none;width:44px;text-align:center;font-weight:700;font-size:20px;line-height:1.1}
.ag-date small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.ag-day.today .ag-date{color:var(--blue-d)}
.ag-list{flex:1;min-width:0}
.ag-list .chip{white-space:normal;overflow:visible;padding:6px 9px;font-size:13px;margin-bottom:5px}
.ag-empty{padding:26px;text-align:center;color:var(--muted)}

/* ---------- Status da nuvem ---------- */
.sync{margin-top:18px;padding:10px 12px;border-radius:10px;background:#f6f8fb;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:none}
.sync-dot.ok{background:#22c55e}
.sync-dot.sync{background:#f59e0b}
.sync-dot.err{background:#ef4444}
.link-btn{border:0;background:transparent;color:var(--blue-d);font-weight:600;padding:0;margin-left:auto;font-size:12.5px}
.link-btn:hover{text-decoration:underline}

/* ---------- Responsivo ---------- */
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  body{grid-template-columns:1fr}
  #sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px}
  .brand{padding:2px 6px 10px}
  .nav-group{margin-top:10px}
  .space-list{flex-direction:row;flex-wrap:wrap;gap:6px}
  .space-item{padding:7px 8px 7px 12px;background:#f3f5f9;max-width:100%}
  .space-item.active{background:var(--blue-soft)}
  .space-item .x{display:block}
  .empty-note{padding-left:12px}
  main{padding:18px 14px 40px}
}
@media(max-width:720px){
  body{font-size:15px}
  .page-head h1{font-size:22px;overflow-wrap:anywhere}
  .month-nav{width:100%;justify-content:space-between}
  .month-nav .lbl{min-width:0;flex:1}
  .stats{gap:10px}
  .stat{padding:12px 14px}
  .stat .n{font-size:26px}
  .toolbar{flex-direction:column;align-items:stretch}
  .seg{overflow-x:auto;max-width:100%}
  .seg button{white-space:nowrap;flex:1}
  .toolbar .btn{width:100%;padding:12px}

  /* tabela vira lista de cartões, com o nome completo */
  .tbl-wrap{overflow:visible}
  table{min-width:0}
  table,tbody{display:block}
  thead{display:none}
  tbody tr{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 14px;border-bottom:1px solid #eef1f5}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover td{background:transparent}
  td{display:block;padding:0;border:0;min-width:0;width:auto !important}
  td[data-label]::before{content:attr(data-label);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px}
  td.c-name{grid-column:1 / -1;padding-right:34px}
  td.c-name .name-btn{font-size:16px;padding:4px 0}
  td.c-name .name-btn:hover{background:transparent}
  td.c-sched{grid-column:1 / -1}
  td.c-del{position:absolute;top:8px;right:8px}
  .sched{min-width:0}
  .period-btn{white-space:normal}
  tr.empty-row,tr.add-row{display:block;padding:0}
  tr.empty-row td,tr.add-row td{padding:20px 14px}
  tr.add-row td{padding:8px 10px}

  /* linha do tempo */
  .tl{--nc:132px}
  .tl-name{padding:8px 10px;font-size:13px}

  /* calendário vira agenda */
  .cal-wrap{display:none}
  .cal-agenda{display:block}

  /* kanban em uma coluna */
  .kanban{grid-template-columns:1fr}

  /* janelas viram folhas na base da tela */
  .overlay{place-items:end center;padding:0}
  .modal,.modal.sm,.modal.lg,.picker{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;padding:20px 16px}
  .field-row{grid-template-columns:1fr 1fr}
  .input,.modal input[type=text],textarea.input,.sub-row .sub-text,.sel select{font-size:16px}
  .modal-actions .btn{padding:11px 16px}
}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="sidebar"></aside>
<main id="main"></main>
<div id="modals"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const diffDays = (a,b) => Math.round((b - a) / 864e5);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const STATUS = { todo:'À fazer', doing:'Em progresso', done:'Finalizada' };
const PRIO = { low:'Baixa', mid:'Média', high:'Alta' };

const ICON = {
  cal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};

/* =========================================================
   Dados (salvos no navegador)
   ========================================================= */
const KEY = 'gerenciador-tarefas-v1';

function seed(){
  const t = todayD();
  const d = n => iso(addDays(t, n));
  const mk = (name,a,b,status,priority) => ({ id:uid(), name, start:d(a), end:d(b), status, priority });
  return {
    active:'home', view:'table',
    spaces:[{
      id:uid(), name:'Lançamento do site',
      tasks:[
        mk('Definir escopo do projeto', -6, -3, 'done', 'high'),
        mk('Criar protótipos das telas', -2, 3, 'doing', 'mid'),
        mk('Desenvolver páginas principais', 0, 9, 'doing', 'high'),
        mk('Revisar textos e imagens', 2, 2, 'todo', 'low'),
        mk('Testes finais e publicação', 10, 14, 'todo', 'mid')
      ]
    }]
  };
}
let hadLocal = false;
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && Array.isArray(r.spaces)){ hadLocal = true; return r; }
  }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} cloudPush(); }

/* ---------- Firebase (sincronização entre aparelhos) ----------
   Cole abaixo o firebaseConfig do seu projeto (Console Firebase > Configurações do projeto > Seus apps).
   Enquanto os valores forem "COLE_AQUI", o app funciona só no navegador (localStorage), como antes. */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
const CLOUD_ON = !String(FIREBASE_CONFIG.apiKey).startsWith('COLE_') && typeof firebase !== 'undefined';
const DOC_ID = 'principal';   // todos os aparelhos leem e gravam neste mesmo documento
const cloud = { state: CLOUD_ON ? 'sync' : 'off', ref: null, db: null, unsub: null, lastJson: '', pending: null, timer: null, dirty: false };

let data = load();
if(!data.view) data.view = 'table';
/* garante os novos campos (subtarefas e observações) em tarefas antigas */
data.spaces.forEach(s => s.tasks.forEach(t => {
  if(!Array.isArray(t.subtasks)) t.subtasks = [];
  if(typeof t.notes !== 'string') t.notes = '';
}));
if(data.active !== 'home' && !data.spaces.some(s => s.id === data.active)) data.active = 'home';

const T0 = todayD();
const ui = { month:{ y:T0.getFullYear(), m:T0.getMonth() }, spaceModal:false, task:null, picker:null, confirm:null, subDraft:'', loading:false };

const curSpace = () => data.spaces.find(s => s.id === data.active);
const findTask = id => { const s = curSpace(); return s && s.tasks.find(t => t.id === id); };

/* =========================================================
   Lógica de datas / cronograma
   ========================================================= */
function fmtPeriod(s,e){
  const a = parse(s), b = parse(e);
  const f = (d,y) => `${pad(d.getDate())} ${MON[d.getMonth()]}${y ? ' ' + d.getFullYear() : ''}`;
  if(s === e) return f(a,true);
  if(a.getFullYear() === b.getFullYear()) return `${f(a)} – ${f(b,true)}`;
  return `${f(a,true)} – ${f(b,true)}`;
}
const fmtDM = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;

function schedule(t){
  if(t.status === 'done') return { pct:100, txt:'Concluída', cls:'done' };
  const s = parse(t.start), e = parse(t.end), td = todayD();
  const total = diffDays(s,e) + 1;
  let elapsed = Math.max(0, Math.min(total, diffDays(s, td)));
  let pct = Math.round(elapsed / total * 100), txt, cls = '';
  if(td < s){
    const d = diffDays(td, s);
    txt = d === 1 ? 'Começa amanhã' : `Começa em ${d} dias`;
  }else if(td > e){
    const d = diffDays(e, td);
    txt = `Atrasada há ${d} dia${d > 1 ? 's' : ''}`; cls = 'late'; pct = 100;
  }else{
    const r = diffDays(td, e);
    txt = r === 0 ? 'Termina hoje' : r === 1 ? 'Falta 1 dia' : `Faltam ${r} dias`;
  }
  return { pct, txt, cls };
}

function monthBounds(){
  const { y, m } = ui.month;
  return { first:new Date(y,m,1), last:new Date(y,m+1,0) };
}
function overlaps(t, a, b){ return t.start <= iso(b) && t.end >= iso(a); }
function monthTasks(){
  const sp = curSpace(); if(!sp) return [];
  const { first, last } = monthBounds();
  return sp.tasks.filter(t => overlaps(t, first, last))
    .sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || a.name.localeCompare(b.name));
}
function weekRange(){
  const { y, m } = ui.month, t = todayD();
  const ref = (t.getFullYear() === y && t.getMonth() === m) ? t : new Date(y,m,1);
  const ws = addDays(ref, -ref.getDay()), we = addDays(ws, 6);
  const { first, last } = monthBounds();
  return { s: ws < first ? first : ws, e: we > last ? last : we };
}

/* =========================================================
   Renderização
   ========================================================= */
function render(){ renderSidebar(); renderMain(); renderModals(); }

function renderSidebar(){
  const items = data.spaces.map(s => `
    <div class="nav-item space-item ${data.active === s.id ? 'active' : ''}" data-act="goto" data-id="${s.id}" title="${esc(s.name)}">
      <span class="hash"></span><span class="nm">${esc(s.name)}</span>
      <button class="x" data-act="del-space" data-id="${s.id}" title="Excluir espaço">×</button>
    </div>`).join('');
  $('#sidebar').innerHTML = `
    <div class="brand"><span class="logo">${ICON.check}</span><span>Tarefas</span></div>
    <nav>
      <div class="nav-item ${data.active === 'home' ? 'active' : ''}" data-act="goto-home">${ICON.home}<span>Início</span></div>
      <div class="nav-group">
        <div class="nav-title"><span>${ICON.grid} Espaços</span>
          <button class="add-btn" data-act="open-space-modal" title="Criar espaço" aria-label="Criar espaço">+</button>
        </div>
        <div class="space-list">${items || '<div class="empty-note">Nenhum espaço ainda</div>'}</div>
      </div>
    </nav>${syncBox()}`;
}

function renderMain(){
  const main = $('#main');
  if(ui.loading){
    const bad = cloud.state === 'err';
    main.innerHTML = `<div class="placeholder"><h2>${bad ? 'Não foi possível carregar' : 'Carregando…'}</h2><p>${bad ? esc(cloud.msg || 'Sem conexão com a nuvem') : 'Buscando suas tarefas na nuvem.'}</p>${bad ? '<button class="btn primary" data-act="cloud-retry">Tentar novamente</button>' : ''}</div>`;
    return;
  }
  if(data.active === 'home'){
    main.innerHTML = `
      <div class="page-head"><div><h1>Início</h1></div></div>
      <div class="placeholder"><h2>Página inicial em breve</h2><p>Por enquanto, escolha um espaço no menu lateral ou crie um novo com o botão +.</p></div>`;
    return;
  }
  const sp = curSpace();
  if(!sp){ data.active = 'home'; return renderMain(); }

  const { y, m } = ui.month;
  const tasks = monthTasks();
  const wk = weekRange();
  const weekCount = tasks.filter(t => overlaps(t, wk.s, wk.e)).length;
  const done = tasks.filter(t => t.status === 'done').length;
  const todo = tasks.filter(t => t.status === 'todo').length;
  const pctDone = tasks.length ? Math.round(done / tasks.length * 100) : 0;

  const views = [['table','Tabela'],['timeline','Linha do tempo'],['calendar','Calendário'],['kanban','Kanban']];
  let body = '';
  if(data.view === 'timeline') body = timelineView(tasks);
  else if(data.view === 'calendar') body = calendarView(tasks);
  else if(data.view === 'kanban') body = kanbanView(tasks);
  else body = tableView(tasks);

  main.innerHTML = `
    <div class="page-head">
      <div><h1>${esc(sp.name)}</h1><p class="sub">Tarefas com período em ${MONTHS[m]} de ${y}</p></div>
      <div class="month-nav">
        <button class="mn-btn" data-act="month-prev" aria-label="Mês anterior">‹</button>
        <span class="lbl">${MONTHS[m]} ${y}</span>
        <button class="mn-btn" data-act="month-next" aria-label="Próximo mês">›</button>
        <button class="today-btn" data-act="month-today">Hoje</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat b"><div class="l">Tarefas da semana</div><div class="n">${weekCount}</div><div class="s">${fmtDM(wk.s)} a ${fmtDM(wk.e)}</div></div>
      <div class="stat b"><div class="l">Tarefas do mês</div><div class="n">${tasks.length}</div><div class="s">${MONTHS[m]} de ${y}</div></div>
      <div class="stat green"><div class="l">Tarefas finalizadas</div><div class="n">${done}</div><div class="s">${pctDone}% do mês</div></div>
      <div class="stat red"><div class="l">Tarefas à fazer</div><div class="n">${todo}</div><div class="s">ainda não iniciadas</div></div>
    </div>
    <div class="toolbar">
      <div class="seg" role="tablist">${views.map(([k,l]) => `<button class="${data.view === k ? 'on' : ''}" data-act="set-view" data-view="${k}">${l}</button>`).join('')}</div>
      <button class="btn primary" data-act="new-task">+ Nova tarefa</button>
    </div>
    ${body}`;
}

/* ---------- Tabela ---------- */
function selectPill(kind, id, value){
  const opts = kind === 'status' ? STATUS : PRIO;
  const cls = kind === 'status' ? `st s-${value}` : `p-${value}`;
  return `<span class="sel ${cls}"><select data-field="${kind}" data-id="${id}" aria-label="${kind === 'status' ? 'Status' : 'Prioridade'}">
    ${Object.entries(opts).map(([k,l]) => `<option value="${k}" ${k === value ? 'selected' : ''}>${l}</option>`).join('')}
  </select></span>`;
}
function schedHtml(t){
  const s = schedule(t);
  return `<div class="sched"><div class="bar"><div class="fill ${s.cls}" style="width:${s.pct}%"></div></div><span class="sched-txt ${s.cls}">${s.txt}</span></div>`;
}
function subBadge(t){
  const n = (t.subtasks || []).length; if(!n) return '';
  const d = t.subtasks.filter(s => s.done).length;
  return `<span class="sub-badge ${d === n ? 'all' : ''}">✓ ${d}/${n} subtarefas</span>`;
}
function taskRow(t){
  return `<tr class="${t.status === 'done' ? 'is-done' : ''}">
    <td class="c-name" style="width:28%"><button class="name-btn" data-act="edit-task" data-id="${t.id}" title="Abrir tarefa">${esc(t.name)}</button>${subBadge(t)}</td>
    <td class="c-period" data-label="Período" style="width:17%"><button class="period-btn" data-act="pick-period" data-id="${t.id}">${ICON.cal}<span>${fmtPeriod(t.start,t.end)}</span></button></td>
    <td class="c-status" data-label="Status" style="width:15%">${selectPill('status', t.id, t.status)}</td>
    <td class="c-sched" data-label="Cronograma" style="width:22%">${schedHtml(t)}</td>
    <td class="c-prio" data-label="Prioridade" style="width:13%">${selectPill('priority', t.id, t.priority)}</td>
    <td class="c-del" style="width:5%"><button class="icon-btn" data-act="del-task" data-id="${t.id}" title="Excluir tarefa" aria-label="Excluir tarefa">${ICON.trash}</button></td>
  </tr>`;
}
function tableSection(title, list, emptyMsg, withAdd){
  return `<section class="card">
    <div class="card-head"><h2>${title}</h2><span class="count">${list.length}</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Nome da tarefa</th><th>Período</th><th>Status</th><th>Cronograma</th><th>Prioridade</th><th></th></tr></thead>
      <tbody>
        ${list.length ? list.map(taskRow).join('') : `<tr class="empty-row"><td colspan="6">${emptyMsg}</td></tr>`}
        ${withAdd ? `<tr class="add-row"><td colspan="6"><button class="add-inline" data-act="new-task">+ Nova tarefa</button></td></tr>` : ''}
      </tbody>
    </table></div>
  </section>`;
}
function tableView(tasks){
  const active = tasks.filter(t => t.status !== 'done');
  const fin = tasks.filter(t => t.status === 'done');
  return tableSection('Em andamento', active, 'Nenhuma tarefa em andamento neste mês.', true)
       + tableSection('Finalizadas', fin, 'Nenhuma tarefa finalizada neste mês.', false);
}

/* ---------- Linha do tempo ---------- */
function timelineView(tasks){
  const { y, m } = ui.month;
  const N = new Date(y, m+1, 0).getDate();
  const t0 = todayD();
  const todayIdx = (t0.getFullYear() === y && t0.getMonth() === m) ? t0.getDate() - 1 : -1;
  const first = new Date(y, m, 1);
  const days = [...Array(N)].map((_, i) => {
    const wd = new Date(y, m, i+1).getDay();
    return `<div class="tl-day ${wd === 0 || wd === 6 ? 'we' : ''} ${i === todayIdx ? 'today' : ''}"><small>${'DSTQQSS'[wd]}</small>${i+1}</div>`;
  }).join('');
  const rows = tasks.map(t => {
    const si = Math.max(0, diffDays(first, parse(t.start)));
    const ei = Math.min(N-1, diffDays(first, parse(t.end)));
    const left = si / N * 100, width = (ei - si + 1) / N * 100;
    return `<div class="tl-row">
      <div class="tl-name s-${t.status}" title="${esc(t.name)}"><span class="dot"></span><span class="t">${esc(t.name)}</span></div>
      <div class="tl-track">
        <div class="tl-bar s-${t.status}" style="left:${left}%;width:${width}%" data-act="edit-task" data-id="${t.id}" title="${esc(t.name)} · ${fmtPeriod(t.start,t.end)}">${esc(t.name)}</div>
        ${todayIdx >= 0 ? `<i class="tl-today" style="left:${(todayIdx + .5) / N * 100}%"></i>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<section class="card"><div class="tl-scroll"><div class="tl" style="--n:${N}">
    <div class="tl-head"><div class="tl-name-h">Tarefa</div><div class="tl-days">${days}</div></div>
    ${rows || '<div class="empty-row" style="padding:30px;text-align:center;color:var(--muted)">Nenhuma tarefa neste mês.</div>'}
  </div></div></section>`;
}

/* ---------- Calendário ---------- */
function calendarView(tasks){
  const { y, m } = ui.month;
  const lead = new Date(y, m, 1).getDay();
  const N = new Date(y, m+1, 0).getDate();
  const t0 = iso(todayD());
  let cells = '';
  for(let i = 0; i < lead; i++) cells += '<div class="cal-cell blank"></div>';
  for(let d = 1; d <= N; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const list = tasks.filter(t => t.start <= ds && t.end >= ds);
    const shown = list.slice(0,3);
    cells += `<div class="cal-cell ${ds === t0 ? 'today' : ''}" data-act="new-task" data-date="${ds}">
      <span class="cal-num">${d}</span>
      ${shown.map(t => `<div class="chip s-${t.status}" data-act="edit-task" data-id="${t.id}" title="${esc(t.name)}">${esc(t.name)}</div>`).join('')}
      ${list.length > 3 ? `<div class="more">+${list.length - 3} mais</div>` : ''}
    </div>`;
  }
  const total = lead + N, trail = (7 - total % 7) % 7;
  for(let i = 0; i < trail; i++) cells += '<div class="cal-cell blank"></div>';
  /* agenda (aparece no lugar da grade no celular, com o nome completo) */
  const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let agenda = '';
  for(let d = 1; d <= N; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const list = tasks.filter(t => t.start <= ds && t.end >= ds);
    if(!list.length) continue;
    agenda += `<div class="ag-day ${ds === t0 ? 'today' : ''}"><div class="ag-date"><small>${WD[new Date(y, m, d).getDay()]}</small>${d}</div>
      <div class="ag-list">${list.map(t => `<div class="chip s-${t.status}" data-act="edit-task" data-id="${t.id}">${esc(t.name)}</div>`).join('')}</div></div>`;
  }
  return `<section class="card">
    <div class="cal-wrap">
      <div class="cal-head">${WD.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="cal-agenda">${agenda || '<div class="ag-empty">Nenhuma tarefa neste mês.</div>'}</div>
  </section>`;
}

/* ---------- Kanban ---------- */
function kanbanView(tasks){
  const cols = Object.entries(STATUS).map(([k, label]) => {
    const list = tasks.filter(t => t.status === k);
    return `<div class="kcol" data-status="${k}">
      <div class="kcol-head s-${k}"><span class="dot"></span>${label}<span class="count">${list.length}</span></div>
      ${list.map(t => `<div class="kcard" draggable="true" data-act="edit-task" data-id="${t.id}">
        <div class="kt">${esc(t.name)}</div>
        ${subBadge(t)}
        <div class="km"><span class="kdate">${ICON.cal}${fmtPeriod(t.start,t.end)}</span><span class="pri p-${t.priority}">${PRIO[t.priority]}</span></div>
        ${schedHtml(t)}
      </div>`).join('')}
      <button class="kadd" data-act="new-task" data-status="${k}">+ Adicionar tarefa</button>
    </div>`;
  }).join('');
  return `<div class="kanban">${cols}</div>`;
}

/* ---------- Modais ---------- */
function autosize(){
  document.querySelectorAll('textarea.autosize').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
}
function renderModals(){
  const oldM = document.querySelector('[data-overlay="task"] .modal');
  const sc = oldM ? oldM.scrollTop : 0;
  let h = '';
  if(ui.spaceModal){
    h += `<div class="overlay" data-overlay="space"><div class="modal sm" role="dialog" aria-label="Criar espaço">
      <h3>Novo espaço</h3><p class="muted">Dê um nome para organizar suas tarefas.</p>
      <label class="field"><span>Nome do espaço</span><input id="sp-name" type="text" maxlength="40" placeholder="Ex.: Marketing, Casa, Estudos" autocomplete="off"></label>
      <div class="modal-actions"><button class="btn ghost" data-act="close-space">Cancelar</button><button class="btn primary" data-act="create-space">Criar espaço</button></div>
    </div></div>`;
  }
  if(ui.task){
    const t = ui.task;
    const subs = t.subtasks || [];
    const sDone = subs.filter(s => s.done).length;
    const sPct = subs.length ? Math.round(sDone / subs.length * 100) : 0;
    h += `<div class="overlay" data-overlay="task"><div class="modal lg" role="dialog" aria-label="Tarefa">
      <h3>${t.id ? 'Editar tarefa' : 'Nova tarefa'}</h3><p class="muted">${t.id ? 'Altere os detalhes, subtarefas e observações e salve.' : 'Preencha os detalhes da tarefa.'}</p>
      <label class="field"><span>Nome da tarefa</span><textarea id="tm-name" class="input autosize" rows="1" data-draft="name" placeholder="O que precisa ser feito?">${esc(t.name)}</textarea></label>
      <div class="field"><span>Período</span><button class="period-btn wide" data-act="tm-pick">${ICON.cal}<span>${fmtPeriod(t.start,t.end)}</span></button></div>
      <div class="field-row">
        <label class="field"><span>Status</span><select class="input" data-draft="status">${Object.entries(STATUS).map(([k,l]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field"><span>Prioridade</span><select class="input" data-draft="priority">${Object.entries(PRIO).map(([k,l]) => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <div class="field">
        <div class="field-head"><span>Subtarefas</span><small>${subs.length ? `${sDone}/${subs.length} concluídas` : ''}</small></div>
        <div class="subs">
          ${subs.length ? `<div class="bar sub-prog"><div class="fill ${sDone === subs.length ? 'done' : ''}" style="width:${sPct}%"></div></div>` : '<div class="sub-empty">Nenhuma subtarefa ainda.</div>'}
          ${subs.map(s => `<div class="sub-row ${s.done ? 'done' : ''}">
            <input type="checkbox" data-sub="done" data-sid="${s.id}" ${s.done ? 'checked' : ''} aria-label="Concluir subtarefa">
            <textarea class="sub-text autosize" rows="1" data-sub="text" data-sid="${s.id}" aria-label="Subtarefa">${esc(s.text)}</textarea>
            <button class="icon-btn" data-act="sub-del" data-sid="${s.id}" title="Remover subtarefa" aria-label="Remover subtarefa">${ICON.trash}</button>
          </div>`).join('')}
          <div class="sub-add"><input id="sub-new" type="text" placeholder="Adicionar subtarefa..." value="${esc(ui.subDraft)}" autocomplete="off"><button class="btn ghost" data-act="sub-add">Adicionar</button></div>
        </div>
      </div>
      <label class="field"><span>Observações</span><textarea class="input" rows="4" data-draft="notes" placeholder="Anotações, links, detalhes importantes...">${esc(t.notes)}</textarea></label>
      <div class="modal-actions">
        ${t.id ? '<button class="btn danger" data-act="tm-delete">Excluir</button>' : ''}<span class="sp"></span>
        <button class="btn ghost" data-act="tm-cancel">Cancelar</button><button class="btn primary" data-act="tm-save">Salvar</button>
      </div>
    </div></div>`;
  }
  if(ui.picker){
    const p = ui.picker;
    const first = new Date(p.vy, p.vm, 1), lead = first.getDay(), N = new Date(p.vy, p.vm+1, 0).getDate();
    const td = iso(todayD());
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<div class="pk-cell"></div>';
    for(let d = 1; d <= N; d++){
      const ds = `${p.vy}-${pad(p.vm+1)}-${pad(d)}`;
      const inR = ds >= p.start && ds <= p.end;
      const isS = ds === p.start, isE = ds === p.end;
      cells += `<div class="pk-cell ${inR ? 'rng' : ''} ${isS ? 'rs' : ''} ${isE ? 're' : ''}">
        <button class="pk-day ${isS || isE ? 'end' : ''} ${ds === td ? 'today' : ''}" data-act="pk-day" data-date="${ds}">${d}</button></div>`;
    }
    const days = diffDays(parse(p.start), parse(p.end)) + 1;
    const info = p.start === p.end ? `Dia único: ${fmtPeriod(p.start,p.end)}` : `Período: ${fmtPeriod(p.start,p.end)} (${days} dias)`;
    h += `<div class="overlay top" data-overlay="picker"><div class="modal picker" role="dialog" aria-label="Escolher período">
      <div class="pk-head"><button class="mn-btn" data-act="pk-prev" aria-label="Mês anterior">‹</button><strong>${MONTHS[p.vm]} ${p.vy}</strong><button class="mn-btn" data-act="pk-next" aria-label="Próximo mês">›</button></div>
      <div class="pk-week">${['D','S','T','Q','Q','S','S'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="pk-grid">${cells}</div>
      <div class="pk-info">${info}</div>
      <p class="pk-hint">${p.anchor ? 'Clique em outro dia para definir um período ou em Aplicar para manter um único dia.' : 'Clique em um dia. Para um período, clique em outro dia em seguida.'}</p>
      <div class="modal-actions"><button class="btn ghost" data-act="pk-cancel">Cancelar</button><button class="btn primary" data-act="pk-apply">Aplicar</button></div>
    </div></div>`;
  }
  if(ui.confirm){
    h += `<div class="overlay topmost" data-overlay="confirm"><div class="modal sm" role="alertdialog">
      <h3>${esc(ui.confirm.title)}</h3><p class="muted" style="margin-bottom:0">${esc(ui.confirm.text)}</p>
      <div class="modal-actions"><button class="btn ghost" data-act="cf-no">Cancelar</button><button class="btn danger" data-act="cf-yes">Excluir</button></div>
    </div></div>`;
  }
  $('#modals').innerHTML = h;
  const newM = document.querySelector('[data-overlay="task"] .modal');
  if(newM) newM.scrollTop = sc;
  autosize();
}

/* =========================================================
   Ações
   ========================================================= */
function openSpaceModal(){
  ui.spaceModal = true; renderModals();
  setTimeout(() => { const i = $('#sp-name'); if(i) i.focus(); }, 30);
}
function createSpace(){
  const input = $('#sp-name'); const name = input.value.trim();
  if(!name){ input.classList.add('err'); input.focus(); return; }
  const sp = { id:uid(), name, tasks:[] };
  data.spaces.push(sp); data.active = sp.id; ui.spaceModal = false;
  save(); render();
}
function openTaskModal(task, defaults){
  ui.subDraft = '';
  if(task){ ui.task = { ...task, subtasks:(task.subtasks || []).map(s => ({ ...s })), notes:task.notes || '' }; }
  else{
    const { first } = monthBounds(); const t = todayD();
    const base = (defaults && defaults.date) || iso((t.getFullYear() === ui.month.y && t.getMonth() === ui.month.m) ? t : first);
    ui.task = { id:null, name:'', start:base, end:base, status:(defaults && defaults.status) || 'todo', priority:'mid', subtasks:[], notes:'' };
  }
  renderModals();
  setTimeout(() => { const i = $('#tm-name'); if(i && !ui.task.id) i.focus(); }, 30);
}
function saveTaskModal(){
  const t = ui.task, input = $('#tm-name');
  if(!t.name.trim()){ input.classList.add('err'); input.focus(); return; }
  const sp = curSpace();
  if(ui.subDraft.trim()) t.subtasks.push({ id:uid(), text:ui.subDraft.trim(), done:false });
  const subtasks = t.subtasks.map(s => ({ id:s.id, text:s.text.trim(), done:!!s.done })).filter(s => s.text);
  const fields = { name:t.name.trim(), start:t.start, end:t.end, status:t.status, priority:t.priority, subtasks, notes:t.notes || '' };
  if(t.id){
    const ex = sp.tasks.find(x => x.id === t.id);
    Object.assign(ex, fields);
  }else{
    sp.tasks.push({ id:uid(), ...fields });
  }
  ui.task = null; ui.subDraft = ''; save(); render();
}
function addSubtask(){
  const text = ui.subDraft.trim();
  if(!text){ const i = $('#sub-new'); if(i) i.focus(); return; }
  ui.task.subtasks.push({ id:uid(), text, done:false });
  ui.subDraft = '';
  renderModals();
  const i = $('#sub-new'); if(i) i.focus();
}
function openPicker(start, end, onApply){
  const d = parse(start);
  ui.picker = { start, end, anchor:null, vy:d.getFullYear(), vm:d.getMonth(), onApply };
  renderModals();
}
function askConfirm(title, text, onYes){ ui.confirm = { title, text, onYes }; renderModals(); }

function closeTop(){
  if(ui.confirm){ ui.confirm = null; }
  else if(ui.picker){ ui.picker = null; }
  else if(ui.task){ ui.task = null; }
  else if(ui.spaceModal){ ui.spaceModal = false; }
  else return;
  renderModals();
}

document.addEventListener('click', e => {
  const ov = e.target.closest('[data-overlay]');
  if(ov && e.target === ov){
    const k = ov.dataset.overlay;
    if(k === 'confirm') ui.confirm = null; else if(k === 'picker') ui.picker = null;
    else if(k === 'task') ui.task = null; else if(k === 'space') ui.spaceModal = false;
    renderModals(); return;
  }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const sp = curSpace();

  switch(act){
    case 'goto-home': data.active = 'home'; save(); render(); break;
    case 'goto': data.active = id; save(); render(); break;
    case 'open-space-modal': openSpaceModal(); break;
    case 'close-space': ui.spaceModal = false; renderModals(); break;
    case 'create-space': createSpace(); break;
    case 'del-space': {
      const s = data.spaces.find(x => x.id === id);
      askConfirm('Excluir espaço', `O espaço "${s.name}" e todas as suas tarefas serão excluídos. Essa ação não pode ser desfeita.`, () => {
        data.spaces = data.spaces.filter(x => x.id !== id);
        if(data.active === id) data.active = 'home';
        save(); render();
      });
      break;
    }
    case 'month-prev': ui.month = ui.month.m === 0 ? { y:ui.month.y - 1, m:11 } : { y:ui.month.y, m:ui.month.m - 1 }; render(); break;
    case 'month-next': ui.month = ui.month.m === 11 ? { y:ui.month.y + 1, m:0 } : { y:ui.month.y, m:ui.month.m + 1 }; render(); break;
    case 'month-today': { const t = todayD(); ui.month = { y:t.getFullYear(), m:t.getMonth() }; render(); break; }
    case 'set-view': data.view = el.dataset.view; save(); render(); break;
    case 'new-task': openTaskModal(null, { date:el.dataset.date, status:el.dataset.status }); break;
    case 'edit-task': { const t = findTask(id); if(t) openTaskModal(t); break; }
    case 'del-task': {
      const t = findTask(id);
      askConfirm('Excluir tarefa', `Deseja excluir "${t.name}"?`, () => { sp.tasks = sp.tasks.filter(x => x.id !== id); save(); render(); });
      break;
    }
    case 'pick-period': {
      const t = findTask(id);
      openPicker(t.start, t.end, (s, en) => { t.start = s; t.end = en; save(); });
      break;
    }
    case 'tm-pick': openPicker(ui.task.start, ui.task.end, (s, en) => { ui.task.start = s; ui.task.end = en; }); break;
    case 'tm-save': saveTaskModal(); break;
    case 'sub-add': addSubtask(); break;
    case 'cloud-retry': cloudRetry(); break;
    case 'sub-del': ui.task.subtasks = ui.task.subtasks.filter(s => s.id !== el.dataset.sid); renderModals(); break;
    case 'tm-cancel': ui.task = null; renderModals(); break;
    case 'tm-delete': {
      const tid = ui.task.id, name = ui.task.name;
      askConfirm('Excluir tarefa', `Deseja excluir "${name}"?`, () => { sp.tasks = sp.tasks.filter(x => x.id !== tid); ui.task = null; save(); render(); });
      break;
    }
    case 'pk-prev': { const p = ui.picker; if(p.vm === 0){ p.vm = 11; p.vy--; } else p.vm--; renderModals(); break; }
    case 'pk-next': { const p = ui.picker; if(p.vm === 11){ p.vm = 0; p.vy++; } else p.vm++; renderModals(); break; }
    case 'pk-day': {
      const p = ui.picker, d = el.dataset.date;
      if(!p.anchor){ p.start = p.end = d; p.anchor = d; }
      else{
        if(d < p.anchor){ p.start = d; p.end = p.anchor; } else { p.start = p.anchor; p.end = d; }
        p.anchor = null;
      }
      renderModals(); break;
    }
    case 'pk-apply': { const p = ui.picker; p.onApply(p.start, p.end); ui.picker = null; render(); break; }
    case 'pk-cancel': ui.picker = null; renderModals(); break;
    case 'cf-no': ui.confirm = null; renderModals(); break;
    case 'cf-yes': { const fn = ui.confirm.onYes; ui.confirm = null; fn(); renderModals(); break; }
  }
});

/* Edição inline na tabela e campos dos modais */
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.field){
    const t = findTask(el.dataset.id); if(!t) return;
    if(el.dataset.field === 'name'){
      const v = el.value.trim();
      if(v) t.name = v;
    }else{
      t[el.dataset.field] = el.value;
    }
    save(); render();
  }else if(el.dataset.sub === 'done' && ui.task){
    const s = ui.task.subtasks.find(x => x.id === el.dataset.sid);
    if(s){ s.done = el.checked; renderModals(); }
  }else if(el.dataset.draft && ui.task){
    ui.task[el.dataset.draft] = el.value;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.draft && ui.task){ ui.task[el.dataset.draft] = el.value; el.classList.remove('err'); }
  if(el.dataset.sub === 'text' && ui.task){
    const s = ui.task.subtasks.find(x => x.id === el.dataset.sid);
    if(s) s.text = el.value;
  }
  if(el.id === 'sub-new') ui.subDraft = el.value;
  if(el.classList && el.classList.contains('autosize')){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  if(el.id === 'sp-name') el.classList.remove('err');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeTop(); return; }
  if(e.key === 'Enter'){
    if(e.target.id === 'sp-name'){ e.preventDefault(); createSpace(); }
    else if(e.target.id === 'tm-name'){ e.preventDefault(); saveTaskModal(); }
    else if(e.target.id === 'sub-new'){ e.preventDefault(); addSubtask(); }
    else if(e.target.dataset && e.target.dataset.sub === 'text'){ e.preventDefault(); e.target.blur(); }
    else if(e.target.classList && e.target.classList.contains('name-input')){ e.target.blur(); }
  }
});

/* Arrastar e soltar no Kanban */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.kcard'); if(!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => c.classList.add('dragging'), 0);
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging,.drop-over').forEach(x => x.classList.remove('dragging','drop-over'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kcol'); if(!col) return;
  e.preventDefault();
  document.querySelectorAll('.drop-over').forEach(x => { if(x !== col) x.classList.remove('drop-over'); });
  col.classList.add('drop-over');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.kcol'); if(!col) return;
  e.preventDefault();
  const t = findTask(e.dataTransfer.getData('text/plain'));
  if(t && t.status !== col.dataset.status){ t.status = col.dataset.status; save(); }
  render();
});

/* =========================================================
   Sincronização com o Firestore
   ========================================================= */
const SYNC_TXT = { ok:'Sincronizado', sync:'Sincronizando…', err:'Sem conexão com a nuvem' };
function syncBox(){
  if(!CLOUD_ON) return '';
  const st = cloud.state;
  return `<div class="sync"><span class="sync-dot ${st}"></span><span>${esc(cloud.msg || SYNC_TXT[st] || '')}</span><button class="link-btn" data-act="cloud-retry">Atualizar</button></div>`;
}
function setSync(st, msg){ cloud.state = st; cloud.msg = msg || ''; renderSidebar(); }
const spacesJson = () => JSON.stringify(data.spaces);
const modalOpen = () => !!(ui.task || ui.picker || ui.confirm || ui.spaceModal);
function normalize(){
  data.spaces.forEach(s => (s.tasks || (s.tasks = [])).forEach(t => {
    if(!Array.isArray(t.subtasks)) t.subtasks = [];
    if(typeof t.notes !== 'string') t.notes = '';
  }));
}
function applyPending(){
  if(cloud.pending === null || modalOpen()) return;
  const json = cloud.pending; cloud.pending = null;
  try{
    const spaces = JSON.parse(json);
    if(Array.isArray(spaces)){
      cloud.lastJson = json;
      data.spaces = spaces; normalize();
      if(data.active !== 'home' && !data.spaces.some(s => s.id === data.active)) data.active = 'home';
      try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    }
  }catch(e){ console.error(e); }
  ui.loading = false; render();
}
setInterval(applyPending, 800);

function cloudPush(){
  if(!CLOUD_ON || ui.loading) return;
  cloud.dirty = true; clearTimeout(cloud.timer); setSync('sync');
  cloud.timer = setTimeout(cloudPushNow, 500);
}
const errMsg = e => (e && e.code === 'permission-denied') ? 'Regras do Firestore bloqueando o acesso' : 'Sem conexão com a nuvem';
async function cloudPushNow(){
  cloud.dirty = false;
  if(!cloud.ref){ return; }
  const json = spacesJson();
  if(json === cloud.lastJson){ setSync('ok'); return; }
  const prev = cloud.lastJson; cloud.lastJson = json;
  try{
    await cloud.ref.set({ json, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    if(!cloud.dirty) setSync('ok');
  }catch(e){ console.error(e); cloud.lastJson = prev; setSync('err', errMsg(e)); }
}
async function cloudConnect(){
  if(!CLOUD_ON) return;
  if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
  setSync('sync');
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    if(!cloud.db){
      cloud.db = firebase.firestore();
      try{ cloud.db.settings({ experimentalAutoDetectLongPolling:true, merge:true }); }catch(e){}
    }
    cloud.ref = cloud.db.collection('workspaces').doc(DOC_ID);
    cloud.lastJson = '';
    let first = true;
    cloud.unsub = cloud.ref.onSnapshot(snap => {
      if(snap.metadata.hasPendingWrites) return;          // eco da própria escrita
      if(!snap.exists && snap.metadata.fromCache) return; // cache vazio: espera o servidor responder
      const wasFirst = first; first = false;
      if(!snap.exists){
        // primeira vez: sobe os dados deste aparelho (ou os exemplos, se não havia nada)
        if(ui.loading){ data.spaces = seed().spaces; ui.loading = false; render(); }
        save(); return;
      }
      const json = snap.data().json;
      if(json === cloud.lastJson){ setSync('ok'); return; }
      if(cloud.dirty) return;                                // alteração local pendente vence
      if(json === spacesJson()){ cloud.lastJson = json; ui.loading = false; setSync('ok'); if(wasFirst) render(); return; }
      cloud.pending = json; applyPending(); setSync('ok');
    }, err => {
      console.error(err);
      setSync('err', errMsg(err));
      if(ui.loading) render();
    });
    setTimeout(() => { if(ui.loading){ setSync('err', 'A nuvem não respondeu'); render(); } }, 10000);
  }catch(e){ console.error(e); setSync('err', errMsg(e)); if(ui.loading) render(); }
}

async function cloudRetry(){
  if(!CLOUD_ON) return;
  if(!ui.loading && (cloud.dirty || cloud.state === 'err')){ clearTimeout(cloud.timer); await cloudPushNow(); }
  cloudConnect();
}
function cloudRefresh(){
  if(!CLOUD_ON || !cloud.ref || cloud.dirty || ui.loading) return;
  cloud.ref.get({ source:'server' }).then(snap => {
    if(snap.exists && !cloud.dirty && snap.data().json !== spacesJson()){ cloud.pending = snap.data().json; applyPending(); }
    setSync('ok');
  }).catch(e => setSync('err', errMsg(e)));
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') cloudRefresh(); });
window.addEventListener('online', cloudRefresh);
window.addEventListener('focus', cloudRefresh);

if(CLOUD_ON && !hadLocal){ data.spaces = []; ui.loading = true; }
render();
cloudConnect();
</script>
